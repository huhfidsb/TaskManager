<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>絶対忘れないタスク</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- 1. ログイン画面（未ログイン時に表示） -->
    <div id="auth-section" class="container">
        <h1>タスク管理アプリ</h1>
        <div class="auth-container" style="background: var(--card-bg); padding: 20px; border-radius: 12px; margin-top: 20px;">
            <h2>ログイン / 新規登録</h2>
            <br>
            <input type="email" id="auth-email" placeholder="メールアドレス" required>
            <input type="password" id="auth-password" placeholder="パスワード（6文字以上）" required>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button onclick="handleSignIn()">ログイン</button>
                <button onclick="handleSignUp()" style="background-color: #34c759;">新規登録</button>
            </div>
        </div>
    </div>

    <!-- 2. アプリ本体画面（ログイン後に表示） -->
    <div id="app-section" class="container" style="display: none;">
        
        <!-- ヘッダー（ユーザー表示 & ログアウト） -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <span id="user-email-display" style="font-size: 12px; color: #8e8e93;"></span>
            <button onclick="handleSignOut()" style="background-color: #e5e5ea; color: #333; width: auto; padding: 5px 10px; font-size: 12px;">ログアウト</button>
        </div>

        <!-- 通知許可の案内バナー -->
        <div id="notification-banner" style="background: #f0f0f7; padding: 10px 15px; border-radius: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 13px; color: #555;">🔔 期限7日前からの通知を受け取る</span>
            <button onclick="requestNotificationPermission()" style="width: auto; padding: 5px 12px; font-size: 12px; background: var(--accent);">通知を許可</button>
        </div>

        <!-- 7日以内タスクのアラート表示エリア -->
        <div id="urgent-container"></div>

        <!-- トップ画面（ファイル一覧 ＆ ファイル無しのタスク） -->
        <div id="view-top">
            <div class="header-bar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h1>📁 ファイル一覧</h1>
            </div>

            <!-- ファイル作成フォーム -->
            <div class="folder-add-box" style="display: flex; gap: 8px; margin-bottom: 20px;">
                <input type="text" id="new-folder-name" placeholder="新しいファイル名（例：大学の課題）" style="margin-bottom: 0;">
                <button onclick="addFolder()" style="width: auto; padding: 0 15px; white-space: nowrap;">ファイル作成</button>
            </div>

            <!-- ファイル一覧グリッド -->
            <div id="folder-grid" class="folder-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px;"></div>

            <hr style="border: none; border-top: 1px solid #e5e5ea; margin: 30px 0;">

            <!-- ファイルに属さない単発タスク -->
            <div class="header-bar">
                <h2>📝 ファイル無しのタスク</h2>
            </div>
            
            <div class="form-group">
                <input type="text" id="top-task-name" placeholder="ファイルに入れない単発タスク" required>
                <input type="datetime-local" id="top-deadline" required>
                <textarea id="top-task-detail" placeholder="メモ（任意）"></textarea>
                <button onclick="addUnfiledTask()">タスクを追加</button>
            </div>

            <ul id="unfiled-task-list" class="task-list"></ul>
        </div>

        <!-- ファイル詳細画面（ファイルの中身） -->
        <div id="view-folder-detail" style="display: none;">
            <div class="header-bar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <button class="back-btn" onclick="closeFolder()" style="background-color: #76768033; color: var(--text-main); width: auto; padding: 6px 12px; font-size: 14px; border-radius: 8px; cursor: pointer;">← ファイル一覧に戻る</button>
                <h1 id="current-folder-title">ファイル名</h1>
                <button onclick="deleteCurrentFolder()" style="background-color: #ff3b30; color: white; width: auto; padding: 6px 12px; font-size: 12px; border-radius: 8px;">ファイルを削除</button>
            </div>

            <!-- タスク状態タブ（未完了 / 完了履歴） -->
            <div class="tab-section" style="display: flex; gap: 8px; margin-bottom: 15px;">
                <button id="tab-active" class="tab-btn active" onclick="switchTab(false)">未完了</button>
                <button id="tab-completed" class="tab-btn" onclick="switchTab(true)">完了履歴</button>
            </div>
            
            <!-- ファイル内タスク追加フォーム -->
            <div id="task-form-group" class="form-group">
                <input type="text" id="task-name" placeholder="このファイル内に追加するタスク名" required>
                <input type="datetime-local" id="deadline" required>
                <textarea id="task-detail" placeholder="メモ（任意）"></textarea>
                <button onclick="addTask()">ファイル内にタスクを追加</button>
            </div>

            <h2 id="list-title">未完了のタスク</h2>
            <ul id="folder-task-list" class="task-list"></ul>
        </div>

    </div>

    <!-- 切り分けた外部JavaScriptファイルの読み込み -->
    <script src="script.js"></script>
</body>
</html>
